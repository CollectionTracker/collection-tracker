name: Task
description: A chore, refactor, docs or other non-feature work item
title: "chore: "
labels: ["chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done, and why?
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Tasks
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: textarea
    id: context
    attributes:
      label: Additional context
