name: Bug report
description: Something is broken or behaving unexpectedly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Drag in screenshots, or paste console or server output.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS and Node version, or commit hash.
      placeholder: Chrome 130, Ubuntu 24.04, Node 22
  - type: textarea
    id: context
    attributes:
      label: Additional context
